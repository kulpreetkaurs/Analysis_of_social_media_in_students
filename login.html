<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Student Analytics</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}
.login-container {
    width: 350px;
    margin: 120px auto;
    padding: 25px;
    background: rgba(255,255,255,0.08);
    border-radius: 15px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    text-align: center;
}
.login-container h2 {
    margin-bottom: 20px;
    color: #00ffff;
}
.login-container input {
    width: 90%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    outline: none;
}
.login-container button {
    width: 50%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #00ffff;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
.login-container button:hover {
    background: #00e6e6;
}
.message {
    margin-top: 10px;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="login-container">
    <h2>Admin Login</h2>

```
<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
<p class="message" id="msg"></p>
```
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDVaLxUbdPTFRlBE7w_js72Z_M8IplpoX8",
  authDomain: "student-social-media-analysis.firebaseapp.com",
  projectId: "student-social-media-analysis",
  storageBucket: "student-social-media-analysis.firebasestorage.app",
  messagingSenderId: "939621840778",
  appId: "1:939621840778:web:6b205f509ff16e0b03fa73",
  measurementId: "G-T9QHTV60SH"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
window.signup = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
        document.getElementById("msg").innerText = "Signup Successful ✅";
    })
    .catch(error => {
        document.getElementById("msg").innerText = error.message;
    });
};
window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    signInWithEmailAndPassword(auth, email, password)
    .then(() => {
        document.getElementById("msg").innerText = "Login Successful ✅";
        setTimeout(() => {
            window.location.href = "index.html"; 
        }, 1000);
    })
    .catch(error => {
        document.getElementById("msg").innerText = error.message;
    });
};
const params = new URLSearchParams(window.location.search);
if (params.get("logout") === "success") {
    document.getElementById("msg").innerText = "Logged out successfully ✅";
}
</script>
</body>
</html>
